<g font-family="Arial,Helvetica,sans-serif" fill="#edf0eb">
<text x="40" y="54" fill="#a7e59b" font-size="13" letter-spacing="3">GCP INGESTION LAB / THE FLOW</text>
<text x="40" y="98" font-size="30" font-weight="bold">Commit first. Report second. Preserve the source.</text>
<g fill="none" stroke="#a7e59b" stroke-width="2" marker-end="url(#arrow)">
<path d="M250 221H286"/><path d="M500 221H536"/><path d="M750 221H786"/><path d="M1000 221H1036"/>
