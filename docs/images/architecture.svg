</g>
<g font-size="12" fill="#a7e59b" letter-spacing="1.5">
<text x="58" y="182">01 / PRODUCER</text><text x="308" y="182">02 / GCS</text><text x="558" y="182">03 / EVENTARC</text>
<text x="808" y="182">04 / CLOUD RUN</text><text x="1058" y="182">05 / BIGQUERY</text>
<text x="808" y="362">CONTROL BUCKET</text><text x="1078" y="362">COMMITTED → RECEIPT</text>
</g>
<g font-size="20" font-weight="bold">
<text x="58" y="214">Collect</text><text x="308" y="214">Preserve CSV</text><text x="558" y="214">Deliver event</text>
<text x="808" y="214">Validate</text><text x="1058" y="214">Stage + transactional MERGE</text>
</g>
<g font-size="14" fill="#99a7ae">
<text x="58" y="247">Monitor publication, too</text><text x="308" y="247">Exact object generation</text><text x="558" y="247">At least once · retries</text>
<text x="808" y="247">Fixed schema · stable IDs</text><text x="1058" y="247">Vendor/day filter · latest observed wins</text>
<text x="808" y="389">Partition locks + receipts</text><text x="808" y="414">No archive mutation rights</text>
<text x="1078" y="389">No receipt? Retry safely.</text><text x="1078" y="414">Uncertain job? Keep the lock.</text>
<text x="393" y="450" fill="#a7e59b">Replay preserved generations; never substitute the latest object</text>
<text x="40" y="518">Local demo: memory adapters / zero dependencies. Optional cloud runtime: authenticated identities / pinned SDKs.</text>
</g></g></svg>
