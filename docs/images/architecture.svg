<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
<title id="title">A batch pipeline with explicit failure boundaries</title><desc id="desc">Collector publishes to a versioned archive, Eventarc delivers to an authenticated Cloud Run loader, which validates and commits to BigQuery before storing a receipt. Partition locks and receipts live in a separate control bucket.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#a7e59b" stroke-width="1.5"/></marker></defs>
